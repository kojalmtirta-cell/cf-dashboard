var KEY_STORE = 'cfx_lock_key';
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function keyFrom(pw) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(LOCKED.salt), iterations: LOCKED.rounds, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open_(key) {
  var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(LOCKED.iv) }, key, b64(LOCKED.data));
  var html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
// a key remembered on this device only works while the password and salt are unchanged
(async function () {
  try {
    var saved = JSON.parse(localStorage.getItem(KEY_STORE) || 'null');
    if (saved && saved.salt === LOCKED.salt) {
      var k = await crypto.subtle.importKey('jwk', saved.jwk, { name: 'AES-GCM' }, true, ['decrypt']);
      await open_(k); return;
    }
  } catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} }
})();
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
  try {
    var key = await keyFrom(document.getElementById('pw').value);
    if (document.getElementById('keep').checked) {
      try { localStorage.setItem(KEY_STORE, JSON.stringify({ salt: LOCKED.salt, jwk: await crypto.subtle.exportKey('jwk', key) })); } catch (e3) {}
    }
    await open_(key);
  } catch (ex) {
    err.textContent = 'Wrong password. Try again.';
    btn.disabled = false; btn.textContent = 'Open dashboard';
  }
});
