var KEY_STORE = 'cfx_lock_key';
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function keyFrom(pw) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(LOCKED.salt), iterations: LOCKED.rounds, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open_(key) {

}
// a key remembered on this device only works while the password and salt are unchanged
(async function () {

})();
